[project]
name = "zevidence"
version = "0.1.0"
description = "Source-grounded multi-agent evidence dossier builder"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/zevidence"]
